  <!-- Auto-redirect a la PWA mobile (/m/) si el viewport es de celular.
       Corre ANTES de cargar React/Supabase para no consumir recursos en vano.
       Si el user llegó por bookmark "Add to home screen" del PWA, ya está en /m/
       y no entra acá. -->
  <script>
    (function () {
      try {
        var isMobile = window.matchMedia && window.matchMedia('(max-width: 820px)').matches;
        var alreadyOnMobile = location.pathname.indexOf('/m/') === 0 || location.pathname === '/m';
        var bypass = location.search.indexOf('desktop=1') >= 0;
        if (isMobile && !alreadyOnMobile && !bypass) {
          location.replace('/m/' + location.search + location.hash);
        }
      } catch (e) { /* fallback silencioso */ }
    })();
  </script>

  <!-- Boot: espera a que los componentes y supabase-js estén listos -->
  <script>
    (function boot() {
      if (
        window.App && window.LoginScreen && window.Sidebar && window.DashboardPage
        && window.AdminPage
        && window.supabase && window.SUPA
      ) {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
      } else {
        setTimeout(boot, 40);
      }
    })();
