server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/manifest+json
        image/svg+xml;

    # ────────────────────────────────────────────────────────────────────
    # Headers de seguridad básicos
    #
    # OJO con cómo hereda nginx: add_header NO se acumula. Un location que
    # declara aunque sea UN add_header propio descarta TODOS los del nivel de
    # arriba. Como casi todos los location de abajo agregan su Cache-Control,
    # estos tres headers se estaban perdiendo justo en los archivos que
    # importan — entre ellos /tienda/index.html, que es la portada que ve el
    # mayorista y quedaba sin X-Frame-Options (o sea, embebible en un iframe
    # ajeno). Por eso se repiten abajo bloque por bloque. Es feo y es la
    # forma correcta: nginx no tiene otra sin njs ni módulos extra.
    # ────────────────────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ────────────────────────────────────────────────────────────────────
    # MOBILE PWA bajo /m/*
    # ────────────────────────────────────────────────────────────────────
    location = /m {
        return 301 /m/;
    }

    location /m/ {
        alias /usr/share/nginx/html/m/;
        index index.html;
        try_files $uri $uri/ /m/index.html;

        # Service worker: NUNCA cachear
        location = /m/sw.js {
            alias /usr/share/nginx/html/m/sw.js;
            expires off;
            add_header Cache-Control "public, max-age=0, must-revalidate";
            add_header Service-Worker-Allowed "/m/";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Manifest: cache corto
        location = /m/manifest.webmanifest {
            alias /usr/share/nginx/html/m/manifest.webmanifest;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            add_header Content-Type "application/manifest+json";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # JSX/JS/CSS de mobile: cache corto (60s) para reflejar pushes rápido
        location ~ ^/m/components/.*\.(jsx|js|css)$ {
            expires 60s;
            add_header Cache-Control "public, max-age=60, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }

    # ────────────────────────────────────────────────────────────────────
    # TIENDA MAYORISTA (B2B) bajo /tienda/*
    # Es una carpeta real adentro del root (no un alias como /m/), así que
    # /tienda/... resuelve solo. Lo que sí hace falta es el try_files propio:
    # sin él, un /tienda/loquesea inexistente caería en el /index.html del
    # SISTEMA INTERNO y el mayorista terminaría mirando el login del personal.
    # ────────────────────────────────────────────────────────────────────
    location = /tienda {
        return 301 /tienda/;
    }

    location /tienda/ {
        try_files $uri $uri/ /tienda/index.html;
    }

    # ────────────────────────────────────────────────────────────────────
    # DESKTOP en / — HTML+JSX+CSS estáticos. Babel compila en browser.
    # ────────────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html y "Macario Lite.html": sin cache
    location ~ ^/(index\.html|Macario%20Lite\.html|Macario\ Lite\.html)$ {
        expires off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # JSX/JS/CSS de web: cache corto para que un push se vea rápido
    location ~ ^/components/.*\.(jsx|js|css)$ {
        expires 60s;
        add_header Cache-Control "public, max-age=60, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Portada de la tienda: sin cache (el regex de arriba está anclado en ^/,
    # así que /tienda/index.html no le entra y necesita su propia regla).
    location = /tienda/index.html {
        expires off;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # JSX/JS/CSS de la tienda: mismo cache corto que el resto
    location ~ ^/tienda/.*\.(jsx|js|css)$ {
        expires 60s;
        add_header Cache-Control "public, max-age=60, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
